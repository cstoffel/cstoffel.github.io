<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Redirect immediately (0 seconds). Change 0 to add a delay. -->
  <meta http-equiv="refresh" content="0; url=https://cstoffel.github.io/shamiComposer/">
  <link rel="canonical" href="https://cstoffel.github.io/shamiComposer/">
  <title>Redirecting...</title>
  <script>
    // JavaScript redirect using replace() so the back button doesn't get stuck in a loop
    window.location.replace("https://cstoffel.github.io/shamiComposer/");
  </script>
</head>
<body>
  <p>If you are not redirected automatically, <a href="https://cstoffel.github.io/shamiComposer/">follow this link</a>.</p>
</body>
</html>
